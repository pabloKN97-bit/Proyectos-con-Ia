function move(o,dt){o.x+=o.vx*dt;for(const s of solids)if(!s.off&&!s.ow&&hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.vx=0}
 const pb=o.y+o.h;o.y+=o.vy*dt;o.ground=false;for(const s of solids)if(!s.off&&hit(o,s)&&(!s.ow||(o.vy>0&&pb<=s.y+1&&!o.drop))){if(o.vy>0){o.y=s.y-o.h;o.ground=true}else o.y=s.y+s.h;o.vy=0}
 o.x=Math.max(0,Math.min(WORLD-o.w,o.x))}

function update(dt){time+=dt;
 const dir=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 const tv=dir*95,k=Math.min(1,dt*(p.ground?14:5));p.vx+=(tv-p.vx)*k;p.vy+=700*dt;
 if((keys.KeyW||keys.ArrowUp||keys.Space)&&p.ground){p.vy=-250;p.ground=false}
 p.drop=false;if(inside)for(const l of ladders)if(p.x+5>l.x-3&&p.x+5<l.x+l.w+3&&p.y+p.h>l.y&&p.y<l.y+l.h){const up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown;if(up)p.vy=-95;else if(dn){p.vy=95;p.drop=true}else if(!p.ground)p.vy=0;break}
 move(p,dt);
 const a=aimAngle();p.face=Math.cos(a)>=0?1:-1;p.t+=Math.abs(p.vx)*dt*.12;
 p.cd-=dt;p.inv-=dt;p.kick=Math.max(0,p.kick-dt*40);p.flash-=dt;
 if(p.rel>0){p.rel-=dt;if(p.rel<=0)p.ammo=30}
 if(mouse.down||keys.KeyJ)shoot();
 for(const b of bullets){for(let i=0;i<3&&b.life>0;i++){b.x+=b.vx*dt/3;b.y+=b.vy*dt/3;let d=false;
  for(const br of barrels)if(!br.dead&&inB(b,br)){hitBarrel(br,b);d=true;break}
  if(!d)for(const e of enemies)if(!e.dead&&inB(b,e)){hurt(e,12,b.vx>0?20:-20);d=true;break}
  if(!d)for(const s of solids)if(!s.off&&!s.ow&&inB(b,s)){spark(b.x,b.y,'#ffd45a',4);d=true;break}
  if(d)b.life=0}b.life-=dt;if(b.x<0||b.x>WORLD)b.life=0}
 for(let i=bullets.length;i--;)if(bullets[i].life<=0)bullets.splice(i,1);
 for(const br of barrels){br.flash-=dt;if(br.armed){br.t-=dt;if(br.t<=0&&!br.dead)explode(br)}
  else if(br.hp===1&&Math.random()<dt*14)P(br.x+6,br.y,(Math.random()-.5)*10,-25,.7,'#4a4440',2,-10)}
 barrels=barrels.filter(b=>!b.dead);
 for(const q of parts){q.life-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
 for(let i=parts.length;i--;)if(parts[i].life<=0)parts.splice(i,1);
 for(const r of rings){r.r+=dt*230;r.life-=dt}for(let i=rings.length;i--;)if(rings[i].life<=0)rings.splice(i,1);
 for(const d of dust){d.x-=d.s*dt;if(d.x<0)d.x=W}
 updWorld(dt);updEnemies(dt);
 if(p.hp<=0){if(inside)leave();for(let i=0;i<30;i++)P(p.x+5,p.y+14,(Math.random()-.5)*160,-Math.random()*140,.7,'#6e5b45',2,500);p.hp=100;p.x=60;p.y=100;p.vx=p.vy=0;p.ammo=30;enemies=[];waveIdx=0;kills=0;trickle=6}
 cam.x+=(Math.max(0,Math.min(WORLD-W,p.x+5-W/2+p.face*30))-cam.x)*Math.min(1,dt*6);{const ty=inside?Math.max(GY-inside.n*76-6,Math.min(0,p.y+14-H/2)):0;cam.y+=(ty-cam.y)*Math.min(1,dt*8)}shake=Math.max(0,shake-dt*30)}

function drawSky(){const top=[42,27,36],bot=[196,105,58];for(let i=0;i<16;i++){const t=i/15;R(`rgb(${top.map((v,j)=>v+(bot[j]-v)*t|0)})`,0,i*H/16,W,H/16+1)}
 ctx.fillStyle='#e89048';const cx=330-cam.x*.05,cy=135,r=36;for(let y=-r;y<=r;y+=1){const w=Math.sqrt(r*r-y*y)|0;ctx.fillRect(cx-w,cy+y,2*w,1)}
 R('rgba(40,22,30,.35)',0,cy-6,W,5);R('rgba(40,22,30,.35)',0,cy+8,W,3);
 sky.forEach((L,i)=>{const par=i?.5:.25,c=i?'#271a22':'#4a2e38';for(const b of L){const x=b.x-cam.x*par;if(x>W||x+b.w<0)continue;
  R(c,x,GY-b.h,b.w,b.h);R(c,x+b.cut,GY-b.h-b.cutH,b.w-b.cut*2>4?b.w-b.cut*2:6,b.cutH);
  if(i)for(const[wx,wy]of b.win)if(wy<b.h-6)R('#c4693a',x+wx,GY-b.h+wy,2,2)}})}
function drawSolid(s){const x=s.x,y=s.y,w=s.w,h=s.h;if(s.t==='ifloor'){R('#4a403a',x,y,w,h);R('#7a6a5c',x,y,w,2);for(let k=x;k<x+w;k+=24)R('#2a221e',k,y+2,1,h-2);return}if(s.t==='ceil'){R('#1a1411',x,y,w,h);R('#2a221e',x,y+h-2,w,2);return}
 if(s.t==='ground'){R('#4a3626',x,y,w,h);R('#6b5036',x,y,w,3);R('#2f2218',x,y+3,w,1);for(const t of stones)R('#2f2218',t.x,t.y,t.w,1);return}
 if(s.t==='crate'){R('#5a3f22',x,y,w,h);R('#7a5a34',x+1,y+1,w-2,h-2);R('#5a3f22',x+2,y+2,w-4,1);R('#5a3f22',x+2,y+h-3,w-4,1);for(let i=0;i<w-4;i++)R('#6a4a28',x+2+i,y+2+i*(h-4)/(w-4)|0,1,1);return}
 if(s.t==='wall'){R('#5a5856',x,y,w,h);R('#7a7876',x,y,w,3);R('#3c3a38',x+10,y+8,1,h-8);R('#3c3a38',x+22,y+3,1,h-3);R('#3c3a38',x,y+16,w,1);R('#222',x+5,y+20,5,3);return}
 if(s.t==='car'){R('#4b3a2e',x,y+5,w,h-5);R('#6a5040',x+w*.2,y,w*.5,6);R('#8a4a22',x+4,y+6,12,4);R('#15100e',x+w*.25,y+1,w*.18,4);R('#15100e',x+w*.5,y+1,w*.14,4);
  R('#111',x+6,y+h-4,8,4);R('#111',x+w-14,y+h-4,8,4);R('#444',x+8,y+h-3,4,2);R('#444',x+w-12,y+h-3,4,2);return}
 if(s.t==='bus'){R('#6e5a2a',x,y,w,h);R('#8a7436',x,y,w,3);R('#4a3a1c',x,y+h-8,w,2);for(let i=0;i<5;i++)R('#15100e',x+6+i*17,y+6,12,8);R('#111',x+10,y+h-5,9,5);R('#111',x+w-22,y+h-5,9,5)}}
function drawBarrel(b){const x=b.x,y=b.y;if(b.armed&&Math.floor(time*20)%2){R('#fff',x-1,y-1,14,18);return}
 R('#6b1511',x+1,y,10,2);R('#b3261e',x,y+1,12,14);R('#d9443a',x+2,y+2,2,12);R('#8a1c16',x+9,y+2,3,12);
 R('#5a1410',x,y+4,12,2);R('#5a1410',x,y+11,12,2);R('#e8c040',x+4,y+7,4,3);R('#6b1511',x+1,y+15,10,1);
 if(b.hp<3){R('#3a0e0c',x+3,y+7,2,1);R('#3a0e0c',x+8,y+3,1,2)}if(b.hp<2){R('#111',x+2,y+2,3,3);R('#111',x+7,y+9,3,2);R('#111',x+5,y+6,1,2)}
 if(b.flash>0)R('rgba(255,255,255,.8)',x,y,12,16)}
function drawPlayer(){const bob=(p.ground&&Math.abs(p.vx)<10&&Math.sin(time*3)>0)?1:0,run=p.ground&&Math.abs(p.vx)>10;
 const s=run?Math.sin(p.t*2):0,air=!p.ground;
 ctx.save();if(p.inv>0&&Math.floor(time*30)%2)ctx.globalAlpha=.4;ctx.translate(Math.round(p.x+5),Math.round(p.y+p.h));ctx.scale(p.face,1);
 const lb=air?-3:-4+s*3,lf=air?2:1-s*3,lift=run?Math.max(0,-s)*2|0:0;
 R('#2b2520',lb,-9+(air?-2:0),3,9);R('#17120f',lb-1,-2,5,2);
 R('#3a322b',lf|0,-9+lift+(air?-2:0),3,9-lift);R('#17120f',(lf|0)-1,-2,5,2);
 R('#6e5b45',-5,-20+bob,10,11);R('#8b7658',-4,-19+bob,8,3);R('#2b2520',-5,-10+bob,10,2);R('#4a3c2c',-3,-15+bob,6,3);
 R('#8b7658',-6,-21+bob,4,4);
 R('#3d3a38',-4,-28+bob,8,8);R('#55504b',-4,-28+bob,8,2);R('#e2a72e',0,-25+bob,4,2);R('rgba(226,167,46,.35)',4,-25+bob,2,2);R('#2b2825',-4,-22+bob,8,1);
 const a=aimAngle(),la=p.face>0?a:Math.PI-a;
 ctx.translate(1,-17+bob);ctx.rotate(la);ctx.translate(-p.kick,0);
 R('#6e5b45',0,-1,9,3);
 if(imgG.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgG,-8,-gunH()*.45,gunW(),gunH())}
 if(p.flash>0){const x=gunW()-6;R('#fff1a8',x,-3,7,6);R('#ffb232',x+7,-2,5,4);R('#ffd45a',x+3,-5,2,10)}
 ctx.restore()}
function drawWorld(){ctx.save();const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.translate(-Math.round(cam.x)+sx|0,-Math.round(cam.y)+sy|0);
 for(const t of inside?[]:trees){if(t.x<cam.x-20||t.x>cam.x+W+20)continue;R('#2b2018',t.x,GY-t.h,2,t.h);R('#2b2018',t.x-6,GY-t.h+8,6,1);R('#2b2018',t.x+2,GY-t.h+14,7,1);R('#2b2018',t.x-4,GY-t.h+7,1,3)}
 if(inside)drawInterior();else drawBuildings();for(const s of solids)drawSolid(s);
 for(const d of decals){R('#17120f',d.x-9,d.y-2,18,2);R('#2b2018',d.x-5,d.y-3,10,1)}
 drawHouseBack();for(const b of barrels)drawBarrel(b);drawLoot();
 drawEnemies();drawPlayer();drawHouseFront();
 for(const b of bullets){ctx.strokeStyle='#ffe28a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.012,b.y-b.vy*.012);ctx.stroke()}
 for(const q of parts){ctx.globalAlpha=Math.min(1,q.life/q.max*1.5);R(q.c,q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
 for(const r of rings){ctx.strokeStyle=`rgba(255,200,120,${r.life*2})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.28);ctx.stroke()}
 ctx.restore()}
function hud(){if(inside){R('rgba(0,0,0,.28)',0,0,W,14);R('rgba(0,0,0,.28)',0,H-14,W,14);R('rgba(0,0,0,.2)',0,0,10,H);R('rgba(0,0,0,.2)',W-10,0,10,H);ctx.font='bold 8px monospace';ctx.fillStyle='#ffe9b8';ctx.fillText(inside.name+' · '+inside.n+' PLANTAS',W/2-44,22)}
 for(const d of dust)R('rgba(230,190,140,.25)',d.x,d.y,1,1);
 R('rgba(0,0,0,.55)',4,4,128,34);ctx.imageSmoothingEnabled=false;if(imgC.naturalWidth)ctx.drawImage(imgC,6,6,30,30*imgC.naturalHeight/imgC.naturalWidth);
 R('#2b2520',40,8,88,7);R(p.hp>35?'#6ab04c':'#d63a12',41,9,Math.max(0,86*p.hp/100),5);
 ctx.font='bold 9px monospace';ctx.fillStyle='#ffe9b8';ctx.fillText(p.rel>0?'RECARGANDO...':`BALAS ${p.ammo}/30`,40,28);
 R('rgba(0,0,0,.55)',W-82,4,78,26);ctx.fillStyle='#ff8a6a';ctx.fillText(`BIDONES: ${barrels.length}`,W-78,14);ctx.fillStyle='#b6f06a';ctx.fillText(`BAJAS: ${kills}`,W-78,26);
 const bx=inside?-9999:W/2-60;R('rgba(0,0,0,.55)',bx-2,4,124,8);for(const q of houses)R('#c4934a',bx+q.x/WORLD*120,6,2,4);for(const e of enemies)if(!e.dead)R(e.k==='robot'?'#ff8a3a':'#7ed321',bx+e.x/WORLD*120,7,1,2);R('#fff',bx+p.x/WORLD*120-1,5,3,5);
 const nh=nearDoor();if(nh){const t=nh.label;ctx.font='bold 8px monospace';const tw=ctx.measureText(t).width,tx=nh.door.x-cam.x+nh.door.w/2;R('rgba(0,0,0,.6)',tx-tw/2-3,GY-66-cam.y,tw+6,11);ctx.fillStyle='#ffe9b8';ctx.fillText(t,tx-tw/2,GY-58-cam.y)}
 const mx=mouse.x|0,my=mouse.y|0;ctx.fillStyle='#fff';ctx.fillRect(mx-4,my,3,1);ctx.fillRect(mx+2,my,3,1);ctx.fillRect(mx,my-4,1,3);ctx.fillRect(mx,my+2,1,3)}
let last=performance.now();
(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);if(inside)R('#120e0c',0,0,W,H);else drawSky();drawWorld();hud();requestAnimationFrame(loop)})(last);
